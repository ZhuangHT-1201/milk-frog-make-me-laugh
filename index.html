<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A chaotic 40-second Milk Frog prank game with eight blackmail photo forms.">
  <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151612" media="(prefers-color-scheme: dark)">
  <title>Milk Frog: Make Me Laugh!</title>
  <style>
:root {
  color-scheme: light dark;
  --background: #f4f1e9;
  --foreground: #181915;
  --card: rgba(255, 255, 255, .7);
  --card-foreground: #181915;
  --muted: #e8e5dc;
  --muted-foreground: #68695f;
  --primary: #171815;
  --primary-foreground: #fffdf6;
  --secondary: #ece9e0;
  --secondary-foreground: #20211d;
  --accent: #f4df87;
  --accent-foreground: #282418;
  --border: rgba(32, 33, 27, .15);
  --input: rgba(32, 33, 27, .12);
  --ring: #b89026;
  --yellow: #d6a928;
  --green: #5b8d55;
  --red: #c34f43;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #151612;
    --foreground: #f5f1e5;
    --card: rgba(48, 46, 39, .78);
    --card-foreground: #f5f1e5;
    --muted: #2d2e28;
    --muted-foreground: #bdb9ad;
    --primary: #f5f1e5;
    --primary-foreground: #171815;
    --secondary: #31322b;
    --secondary-foreground: #f4efe2;
    --accent: #4f421d;
    --accent-foreground: #fff2bf;
    --border: rgba(255, 250, 232, .16);
    --input: rgba(255, 250, 232, .14);
    --ring: #f0c84d;
    --yellow: #e4b840;
    --green: #90c183;
    --red: #ee8b80;
  }
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--background); }
body {
  min-height: 100%;
  margin: 0;
  color: var(--foreground);
  background:
    radial-gradient(circle at 12% 4%, color-mix(in srgb, var(--yellow) 16%, transparent), transparent 28rem),
    radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--green) 12%, transparent), transparent 24rem),
    var(--background);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.45;
}
button, a { -webkit-tap-highlight-color: transparent; }
.site-shell {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: clamp(14px, 3vw, 30px);
}
.card {
  color: var(--card-foreground);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
}
.text-small { font-size: 12px; line-height: 1.4; }
.tabular-nums { font-variant-numeric: tabular-nums; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--foreground);
  background: color-mix(in srgb, var(--card) 85%, transparent);
  font: inherit;
  cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--secondary); }
.btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--ring) 45%, transparent); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; opacity: .42; }
.btn-primary { color: var(--primary-foreground); background: var(--primary); border-color: transparent; }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 88%, var(--foreground)); }
.btn-ghost { background: transparent; }
.btn-block { width: 100%; }
.progress {
  width: 100%;
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: color-mix(in srgb, var(--foreground) 10%, transparent);
}
.progress-bar {
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
}
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
.cursor-interaction { cursor: pointer; }
@media (pointer: coarse) {
  .btn { min-height: 44px; }
}
@media (max-width: 520px) {
  .site-shell { padding: 10px; }
  .card { padding: 12px; }
}
</style>
</head>
<body>
  <main class="site-shell">
    <div id="milk-frog-game" class="frog-game">
  <style>
    #milk-frog-game {
      --frog-lab: light-dark(#f4edcf, #242018);
      --frog-wall: light-dark(#dce9b6, #303d2b);
      --frog-paper: light-dark(#fffaf0, #39332b);
      --frog-ink: light-dark(#2e3225, #f7f1df);
      --frog-muted: light-dark(#6d705e, #c7c2b2);
      --frog-line: light-dark(rgba(52, 57, 37, .17), rgba(255, 249, 221, .16));
      --frog-yellow: light-dark(#f7c943, #e8be45);
      --frog-green: light-dark(#58874f, #91c381);
      --frog-red: light-dark(#c34f43, #f28b83);
      --frog-shadow: light-dark(rgba(62, 54, 28, .2), rgba(0, 0, 0, .38));
      --frog-sheet: url("./assets/naifrog-spritesheet.webp");
      color: var(--foreground);
      color-scheme: light dark;
      width: 100%;
    }

    #milk-frog-game * {
      box-sizing: border-box;
    }

    #milk-frog-game [hidden] {
      display: none !important;
    }

    #milk-frog-game button {
      font: inherit;
    }

    .frog-shell {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    .frog-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .frog-heading {
      min-width: 0;
    }

    .frog-kicker {
      margin: 0 0 4px;
      color: var(--muted-foreground);
      letter-spacing: .09em;
    }

    .frog-title {
      margin: 0;
      font-weight: 500;
      letter-spacing: -.045em;
    }

    .frog-dashboard {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: wrap;
    }

    .frog-metric {
      display: grid;
      gap: 1px;
      min-width: 76px;
    }

    .frog-metric span {
      color: var(--muted-foreground);
    }

    .frog-score {
      margin: 0;
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .frog-multiplier {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--frog-ink);
      background: color-mix(in srgb, var(--frog-yellow) 24%, transparent);
      transition: transform .18s ease, background-color .18s ease;
    }

    .frog-multiplier[data-hot="true"] {
      transform: rotate(-2deg) scale(1.05);
      background: color-mix(in srgb, var(--frog-yellow) 42%, transparent);
    }

    .frog-main {
      display: block;
    }

    .frog-stage {
      position: relative;
      min-height: 430px;
      overflow: hidden;
      border-radius: 24px;
      color: var(--frog-ink);
      background:
        linear-gradient(90deg, transparent 0 92%, color-mix(in srgb, var(--frog-yellow) 10%, transparent) 92%),
        linear-gradient(0deg, transparent 0 92%, color-mix(in srgb, var(--frog-yellow) 8%, transparent) 92%),
        linear-gradient(165deg, var(--frog-wall) 0 72%, var(--frog-lab) 72% 100%);
      background-size: 34px 34px, 34px 34px, auto;
      isolation: isolate;
    }

    .frog-stage::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 9px;
      background: repeating-linear-gradient(135deg, var(--frog-yellow) 0 12px, var(--frog-ink) 12px 24px);
      z-index: 14;
    }

    .frog-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 17px;
      width: min(64%, 300px);
      height: 39px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: color-mix(in srgb, var(--frog-ink) 17%, transparent);
      filter: blur(4px);
      z-index: 2;
    }

    .frog-stage.is-frenzy {
      animation: frog-room-twitch .32s steps(2, end) infinite;
      background:
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--frog-red) 10%, transparent) 0 17px, transparent 17px 34px),
        linear-gradient(165deg, color-mix(in srgb, var(--frog-wall) 78%, var(--frog-red)) 0 72%, var(--frog-lab) 72% 100%);
    }

    .frog-watermark {
      position: absolute;
      left: 50%;
      top: 93px;
      transform: translateX(-50%) rotate(-4deg);
      color: color-mix(in srgb, var(--frog-ink) 8%, transparent);
      font-weight: 500;
      letter-spacing: .1em;
      white-space: nowrap;
      z-index: 0;
      pointer-events: none;
    }

    .frog-speech {
      position: absolute;
      left: 18px;
      top: 28px;
      max-width: 58%;
      padding: 10px 13px;
      border: 1px solid var(--frog-line);
      border-radius: 14px 14px 14px 4px;
      color: var(--frog-ink);
      background: color-mix(in srgb, var(--frog-paper) 94%, transparent);
      box-shadow: 0 7px 18px var(--frog-shadow);
      z-index: 12;
    }

    .frog-speech::after {
      content: "";
      position: absolute;
      left: 25px;
      bottom: -8px;
      width: 14px;
      height: 14px;
      border-right: 1px solid var(--frog-line);
      border-bottom: 1px solid var(--frog-line);
      background: inherit;
      transform: rotate(45deg);
    }

    .frog-label {
      position: absolute;
      left: 17px;
      bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--frog-ink);
      background: color-mix(in srgb, var(--frog-paper) 80%, transparent);
      z-index: 6;
    }

    .frog-label-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--frog-green);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--frog-green) 18%, transparent);
    }

    .frog-poke {
      position: absolute;
      left: 50%;
      bottom: 29px;
      z-index: 7;
      width: 215px;
      height: 233px;
      padding: 0;
      border: 0;
      border-radius: 24px;
      background: transparent;
      transform: translateX(-50%);
      touch-action: manipulation;
    }

    .frog-poke::after {
      content: "戳我";
      position: absolute;
      right: -2px;
      top: 36px;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--frog-ink);
      background: var(--frog-yellow);
      transform: rotate(8deg);
      box-shadow: 0 4px 10px var(--frog-shadow);
      animation: frog-bob 1.25s ease-in-out infinite;
    }

    .frog-poke:active .frog-sprite {
      transform: scale(1.06, .91) rotate(-2deg);
    }

    .frog-sprite {
      display: block;
      width: 100%;
      height: 100%;
      background-image: var(--frog-sheet);
      background-repeat: no-repeat;
      background-position: 0% 0%;
      background-size: 800% 900%;
      filter: drop-shadow(0 14px 9px color-mix(in srgb, var(--frog-shadow) 72%, transparent));
      transform-origin: 50% 92%;
      transition: transform .12s ease;
      pointer-events: none;
    }

    .frog-fallback {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .frog-poster {
      width: 84%;
      height: 84%;
      object-fit: contain;
      opacity: 1;
      transition: opacity .2s ease;
    }

    .frog-game.frog-sprite-ready .frog-poster {
      opacity: 0;
    }

    .frog-ghost {
      position: absolute;
      width: 122px;
      height: 132px;
      left: 50%;
      bottom: 73px;
      transform: translateX(-50%);
      opacity: 0;
      background-image: var(--frog-sheet);
      background-size: 800% 900%;
      background-position: 0% 0%;
      pointer-events: none;
      z-index: 5;
    }

    .frog-stage.is-frenzy .frog-ghost {
      opacity: .35;
      animation: frog-ghost-run 1.15s ease-in-out infinite;
    }

    .frog-stage.is-frenzy .frog-ghost.left {
      margin-left: -117px;
      animation-delay: -.4s;
    }

    .frog-stage.is-frenzy .frog-ghost.right {
      margin-left: 117px;
      animation-delay: -.7s;
    }

    .frog-frenzy-banner {
      position: absolute;
      left: 50%;
      top: 86px;
      z-index: 17;
      padding: 7px 14px;
      border: 2px solid var(--frog-ink);
      border-radius: 4px;
      color: var(--frog-ink);
      background: var(--frog-yellow);
      transform: translateX(-50%) rotate(-3deg);
      box-shadow: 4px 4px 0 var(--frog-ink);
      white-space: nowrap;
    }

    .frog-frenzy-banner[hidden],
    .frog-event[hidden],
    .frog-photo-viewer[hidden],
    .frog-result[hidden] {
      display: none;
    }

    .frog-bonus {
      position: absolute;
      left: var(--bonus-x, 50%);
      top: var(--bonus-y, 45%);
      z-index: 24;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      padding: 0;
      border: 3px solid var(--frog-ink);
      border-radius: 50%;
      color: var(--frog-ink);
      background: var(--frog-yellow);
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--frog-yellow) 30%, transparent), 0 6px 16px var(--frog-shadow);
      transform: translate(-50%, -50%);
      animation: frog-bonus-pop .3s cubic-bezier(.2,.9,.3,1), frog-bonus-pulse .7s ease-in-out infinite alternate;
    }

    .frog-bonus::before {
      content: "!";
      font-weight: 500;
    }

    .frog-flash {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: var(--frog-paper);
      opacity: 0;
      pointer-events: none;
    }

    .frog-flash.is-on {
      animation: frog-camera-flash .34s ease-out;
    }

    .frog-event {
      position: absolute;
      inset: 15px;
      z-index: 30;
      display: grid;
      align-content: center;
      gap: 12px;
      padding: 22px;
      border: 1px solid var(--frog-line);
      border-radius: 19px;
      color: var(--frog-ink);
      background:
        linear-gradient(110deg, color-mix(in srgb, var(--frog-yellow) 18%, var(--frog-paper)) 0 22%, var(--frog-paper) 22% 100%);
      box-shadow: 0 20px 50px var(--frog-shadow);
    }

    .frog-event-title {
      margin: 0;
      font-weight: 500;
    }

    .frog-event-copy {
      margin: 0;
      max-width: 56ch;
      color: var(--frog-muted);
    }

    .frog-event-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .frog-timer-track {
      height: 5px !important;
      margin-top: 2px !important;
    }

    .frog-timer-track .progress-bar {
      transition: width .1s linear;
    }

    .frog-result {
      position: absolute;
      inset: 14px;
      z-index: 35;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 13px;
      padding: 24px;
      overflow: hidden;
      border-radius: 20px;
      color: var(--frog-ink);
      background:
        radial-gradient(circle at 15% 12%, color-mix(in srgb, var(--frog-yellow) 28%, transparent) 0 20%, transparent 21%),
        radial-gradient(circle at 85% 84%, color-mix(in srgb, var(--frog-green) 22%, transparent) 0 24%, transparent 25%),
        var(--frog-paper);
      box-shadow: 0 20px 50px var(--frog-shadow);
      text-align: center;
    }

    .frog-result h2 {
      margin: 0;
      font-weight: 500;
    }

    .frog-result p {
      margin: 0;
      max-width: 44ch;
      color: var(--frog-muted);
    }

    .frog-result-score {
      display: flex;
      align-items: baseline;
      gap: 7px;
      color: var(--frog-ink);
    }

    .frog-result-score b {
      font-weight: 500;
    }

    .frog-result-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .frog-result-chips span {
      padding: 5px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--frog-ink) 8%, transparent);
    }

    .frog-pop {
      position: absolute;
      left: 50%;
      bottom: 52%;
      z-index: 25;
      pointer-events: none;
      white-space: nowrap;
      animation: frog-pop-float 1s ease-out forwards;
    }

    .frog-debris {
      position: absolute;
      left: 50%;
      bottom: 38%;
      z-index: 22;
      pointer-events: none;
      animation: frog-debris 1s cubic-bezier(.18,.75,.3,1) forwards;
    }

    .frog-start-wrap {
      display: grid;
      gap: 6px;
    }

    .frog-start-wrap .btn {
      min-width: 116px;
    }

    .frog-control-deck {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
    }

    .frog-sanity-strip {
      display: grid;
      grid-template-columns: auto auto minmax(90px, 1fr);
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .frog-sanity-strip strong {
      font-weight: 500;
    }

    .frog-sanity-strip .progress {
      margin: 0;
    }

    .frog-icon-btn {
      width: 42px;
      min-width: 42px;
      padding: 0;
    }

    .frog-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .frog-action {
      min-height: 52px;
      justify-content: flex-start;
      white-space: nowrap;
    }

    .frog-action .frog-action-text {
      display: grid;
      gap: 1px;
      text-align: left;
    }

    .frog-action .frog-action-text small {
      color: var(--muted-foreground);
    }

    .frog-gallery-panel {
      display: grid;
      gap: 8px;
    }

    .frog-gallery-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .frog-gallery-head h2 {
      margin: 0;
      font-weight: 500;
    }

    .frog-gallery-count {
      color: var(--muted-foreground);
    }

    .frog-gallery-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
    }

    .frog-photo-thumb {
      min-width: 0;
      padding: 4px 4px 6px;
      border: 1px solid var(--frog-line);
      border-radius: 4px;
      color: var(--frog-ink);
      background: var(--frog-paper);
      box-shadow: 0 5px 13px var(--frog-shadow);
      transform: rotate(-2deg);
      transition: transform .18s ease, opacity .18s ease;
    }

    .frog-photo-thumb:nth-child(even) {
      transform: rotate(2deg);
    }

    .frog-photo-thumb:not(:disabled):hover {
      transform: translateY(-4px) rotate(0);
    }

    .frog-photo-thumb:disabled {
      opacity: .44;
      box-shadow: none;
    }

    .frog-photo-thumb-art,
    .frog-photo-image {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 192 / 208;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--frog-yellow) 25%, var(--frog-paper)), var(--frog-paper));
    }

    .frog-photo-thumb-art {
      min-height: 56px;
    }

    .frog-photo-sprite {
      position: absolute;
      inset: 0;
      background-image: var(--frog-sheet);
      background-repeat: no-repeat;
      background-size: 800% 900%;
      transform-origin: 50% 80%;
      transition: transform .2s ease, filter .2s ease;
    }

    .frog-photo-label {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--frog-muted);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .frog-photo-lock {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--frog-ink);
      background: color-mix(in srgb, var(--frog-paper) 68%, transparent);
    }

    .frog-photo-thumb.is-unlocked .frog-photo-lock {
      display: none;
    }

    .frog-photo-moment {
      position: absolute;
      left: 50%;
      top: 104px;
      z-index: 26;
      width: 174px;
      padding: 7px 7px 9px;
      border: 1px solid var(--frog-line);
      border-radius: 5px;
      color: var(--frog-ink);
      background: var(--frog-paper);
      box-shadow: 0 16px 30px var(--frog-shadow);
      transform: translateX(-50%) rotate(3deg);
      animation: frog-photo-drop .26s cubic-bezier(.18,.8,.25,1);
      pointer-events: none;
    }

    .frog-photo-moment .frog-photo-image {
      height: 160px;
    }

    .frog-photo-caption {
      display: block;
      margin-top: 6px;
      color: var(--frog-muted);
      text-align: center;
    }

    .frog-photo-art-label {
      display: block;
      margin-top: 4px;
      text-align: center;
    }

    .frog-photo-prop {
      position: absolute;
      right: 4px;
      top: 5px;
      z-index: 3;
      transform: rotate(12deg);
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .2));
    }

    .frog-photo-serial {
      position: absolute;
      left: 5px;
      bottom: 4px;
      z-index: 3;
      padding: 1px 4px;
      border-radius: 2px;
      color: var(--frog-paper);
      background: color-mix(in srgb, var(--frog-ink) 80%, transparent);
    }

    .frog-photo-viewer {
      position: absolute;
      inset: 14px;
      z-index: 37;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--frog-ink);
      background: color-mix(in srgb, var(--frog-paper) 94%, transparent);
      border-radius: 20px;
      box-shadow: 0 20px 46px var(--frog-shadow);
    }

    .frog-photo-viewer-card {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: min(280px, 90%);
      padding: 8px 8px 12px;
      border: 1px solid var(--frog-line);
      border-radius: 5px;
      background: var(--frog-paper);
      transform: rotate(-1.5deg);
      box-shadow: 0 10px 25px var(--frog-shadow);
    }

    .frog-photo-viewer-card .frog-photo-image {
      width: 100%;
      height: 220px;
    }

    .frog-photo-viewer-card h2,
    .frog-photo-viewer-card p {
      margin: 0;
      text-align: center;
    }

    .frog-photo-viewer-card h2 {
      font-weight: 500;
    }

    .frog-photo-viewer-card p {
      color: var(--frog-muted);
    }

    .photofx-squash .frog-photo-sprite {
      transform: scale(1.45, .72) rotate(-4deg);
      filter: saturate(1.45) contrast(1.17);
    }

    .photofx-pixel .frog-photo-sprite {
      transform: scale(1.5);
      filter: contrast(1.8) saturate(1.4);
      image-rendering: pixelated;
    }

    .photofx-noir .frog-photo-sprite {
      transform: scale(1.22) rotate(5deg);
      filter: grayscale(1) contrast(1.65);
    }

    .photofx-acid .frog-photo-sprite {
      transform: scale(1.28) rotate(-7deg);
      filter: hue-rotate(145deg) saturate(2.1) contrast(1.18);
    }

    .photofx-door .frog-photo-sprite {
      transform: perspective(120px) rotateY(29deg) scale(.92, 1.26);
      filter: saturate(1.2) contrast(1.25);
    }

    .photofx-tv .frog-photo-sprite {
      transform: scale(1.75) translateY(9%);
      filter: sepia(.45) saturate(1.7) contrast(1.25);
    }

    .photofx-wanted .frog-photo-sprite {
      transform: scale(1.36) rotate(2deg);
      filter: contrast(1.8) saturate(1.7);
    }

    .photofx-glitch .frog-photo-sprite {
      transform: scale(1.32) skewX(-7deg);
      filter: contrast(1.5) saturate(1.8);
      animation: frog-photo-glitch .22s steps(2, end) infinite;
    }

    @keyframes frog-photo-drop {
      0% { opacity: 0; transform: translateX(-50%) translateY(-24px) rotate(-8deg) scale(.82); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(3deg) scale(1); }
    }

    @keyframes frog-photo-glitch {
      0%, 100% { margin-left: -3px; filter: contrast(1.5) saturate(1.8); }
      50% { margin-left: 3px; filter: contrast(1.8) saturate(2.2) hue-rotate(18deg); }
    }

    @keyframes frog-bonus-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-18deg); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    }

    @keyframes frog-bonus-pulse {
      from { margin-top: -4px; }
      to { margin-top: 4px; }
    }

    @keyframes frog-bob {
      0%, 100% { transform: translateY(0) rotate(8deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }

    @keyframes frog-room-twitch {
      0%, 100% { filter: saturate(1); }
      50% { filter: saturate(1.55) contrast(1.08); }
    }

    @keyframes frog-ghost-run {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-3deg) scale(.95); }
      50% { transform: translateX(-50%) translateY(-19px) rotate(4deg) scale(1.04); }
    }

    @keyframes frog-pop-float {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.78); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -78px) scale(.92); }
    }

    @keyframes frog-debris {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(.55) rotate(0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--drift, 0px)), -105px) scale(1.15) rotate(var(--spin, 30deg)); }
    }

    @keyframes frog-camera-flash {
      0% { opacity: .94; }
      100% { opacity: 0; }
    }

    @media (max-width: 650px) {
      .frog-stage {
        min-height: 370px;
      }

      .frog-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .frog-gallery-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .frog-speech {
        max-width: 55%;
      }

      .frog-control-deck {
        grid-template-columns: minmax(0, 1fr);
      }

      .frog-start-wrap .btn {
        width: 100%;
      }

      .frog-poke {
        width: 184px;
        height: 199px;
      }
    }

    @media (max-width: 390px) {
      .frog-dashboard {
        width: 100%;
        justify-content: space-between;
      }

      .frog-speech {
        max-width: 62%;
      }

      .frog-sanity-strip {
        grid-template-columns: auto auto minmax(60px, 1fr);
      }

      .frog-action {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #milk-frog-game *,
      #milk-frog-game *::before,
      #milk-frog-game *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>

  function bubble(text) {
    elements.speech.textContent = text;
    elements.speech.animate?.(
      [
        { transform: "translateY(3px) scale(.97)", opacity: .55 },
        { transform: "translateY(0) scale(1)", opacity: 1 }
      ],
      { duration: 180, easing: "ease-out" }
    );
  }

  function setAnimation(name, holdMs = 0) {
    const config = ANIMS[name] || ANIMS.idle;
    spriteAnimation = {
      name: config === ANIMS[name] ? name : "idle",
      startedAt: performance.now(),
      holdMs
    };
    drawSpriteFrame();
  }

  function drawSpriteFrame() {
    const config = ANIMS[spriteAnimation.name] || ANIMS.idle;
    const elapsed = Math.max(0, performance.now() - spriteAnimation.startedAt);
    if (spriteAnimation.holdMs && elapsed >= spriteAnimation.holdMs) {
      setAnimation(state.frenzy ? "laugh" : "idle");
      return;
    }
    const rawFrame = Math.floor(elapsed / config.speed);
    const frame = rawFrame % config.frames;
    const x = (frame / 7) * 100;
    const y = (config.row / 8) * 100;
    elements.sprite.style.backgroundPosition = `${x}% ${y}%`;
  }

  function bumpCombo(now) {
    state.combo = now - state.lastHitAt < 2500 ? Math.min(99, state.combo + 1) : 1;
    state.lastHitAt = now;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
  }

  function addScore(points) {
    state.score += Math.round(points);
  }

  function showPopup(text, emoji = "💥") {
    const pop = document.createElement("span");
    pop.className = "frog-pop text-small";
    pop.textContent = `${emoji} ${text}`;
    elements.stage.appendChild(pop);
    window.setTimeout(() => pop.remove(), 1050);
  }

  function debris(count = 6) {
    const symbols = ["😂", "🧦", "☕", "📸", "💥", "🤡", "🧪", "🐸"];
    const amount = Math.min(14, count);
    for (let index = 0; index < amount; index += 1) {
      const particle = document.createElement("span");
      particle.className = "frog-debris";
      particle.textContent = choose(symbols);
      particle.setAttribute("aria-hidden", "true");
      particle.style.setProperty("--drift", `${(Math.random() - .5) * 190}px`);
      particle.style.setProperty("--spin", `${(Math.random() - .5) * 110}deg`);
      particle.style.animationDelay = `${index * 36}ms`;
      elements.stage.appendChild(particle);
      window.setTimeout(() => particle.remove(), 1150 + index * 40);
    }
  }

  function cameraFlash() {
    elements.flash.classList.remove("is-on");
    void elements.flash.offsetWidth;
    elements.flash.classList.add("is-on");
    window.setTimeout(() => elements.flash.classList.remove("is-on"), 380);
  }

  function positionPhotoSprite(sprite, form) {
    sprite.style.backgroundPosition = `${(form.frameCol / 7) * 100}% ${(form.frameRow / 8) * 100}%`;
  }

  function paintPhoto(container, sprite, prop, serial, form) {
    container.className = `frog-photo-image ${form.fx}`;
    positionPhotoSprite(sprite, form);
    prop.textContent = form.prop;
    if (serial) serial.textContent = `NAIWA-${String(PHOTO_FORMS.indexOf(form) + 1).padStart(2, "0")}F`;
  }

  function buildGallery() {
    elements.galleryGrid.replaceChildren();
    PHOTO_FORMS.forEach((form) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "frog-photo-thumb cursor-interaction";
      button.dataset.photo = form.id;
      button.disabled = true;

      const art = document.createElement("span");
      art.className = "frog-photo-thumb-art";
      const sprite = document.createElement("span");
      sprite.className = "frog-photo-sprite";
      positionPhotoSprite(sprite, form);
      art.classList.add(form.fx);
      const prop = document.createElement("span");
      prop.className = "frog-photo-prop";
      prop.textContent = form.prop;
      prop.setAttribute("aria-hidden", "true");
      const lock = document.createElement("span");
      lock.className = "frog-photo-lock";
      lock.textContent = "?";
      lock.setAttribute("aria-hidden", "true");
      art.append(sprite, prop, lock);

      const label = document.createElement("span");
      label.className = "frog-photo-label text-small";
      label.textContent = "未解锁";

      button.append(art, label);
      button.addEventListener("click", () => {
        if (state.photoForms.includes(form.id)) showPhotoViewer(form);
      });
      elements.galleryGrid.appendChild(button);
    });
  }

  function showPhotoViewer(form) {
    if (state.event) return;
    removeBonusTarget();

    paintPhoto(
      elements.photoViewerImage,
      elements.photoViewerSprite,
      elements.photoViewerProp,
      elements.photoViewerSerial,
      form
    );
    elements.photoViewerTitle.textContent = form.title;
    elements.photoViewerCaption.textContent = form.caption;
    elements.photoViewer.hidden = false;
    elements.announcer.textContent = `${form.title}。${form.caption}`;
    render();
    window.setTimeout(() => elements.photoViewerClose.focus(), 30);
  }

  function closePhotoViewer() {
    state.photoViewing = false;
    state.nextBonusAt = 1.4;
    elements.photoViewer.hidden = true;
    render();

  function showPhotoMoment(form, isNew) {
    document.querySelectorAll(".frog-photo-moment").forEach((node) => node.remove());
    const card = document.createElement("div");
    card.className = "frog-photo-moment";
    card.setAttribute("aria-hidden", "true");

    const image = document.createElement("span");
    const sprite = document.createElement("span");
    sprite.className = "frog-photo-sprite";

    const serial = document.createElement("span");
    serial.className = "frog-photo-serial text-small";
    paintPhoto(image, sprite, prop, serial, form);
    image.append(sprite, prop, serial);

    const title = document.createElement("span");
    title.className = "frog-photo-art-label";
    title.textContent = isNew ? `NEW · ${form.title}` : form.title;
    const caption = document.createElement("span");
    caption.className = "frog-photo-caption text-small";
    caption.textContent = form.caption;
    card.append(image, title, caption);
    elements.stage.appendChild(card);
    window.setTimeout(() => card.remove(), 1800);

  function capturePhoto() {
    const unseen = PHOTO_FORMS.filter((form) => !state.photoForms.includes(form.id));
    const form = unseen[0] || choose(PHOTO_FORMS);
    const before = state.photoForms.length;
    const isNew = !state.photoForms.includes(form.id);
    state.photoCaptures += 1;
    if (isNew) {
      state.photoForms.push(form.id);
      savePhotoAlbum();
      addScore(form.bonus);
    } else {
      addScore(55);
    }
    showPhotoMoment(form, isNew);
    bubble(choose(["咔嚓。", "证据到手。", "别眨眼。"]));

    if (before < 4 && state.photoForms.length >= 4) {
      addScore(320);
      showPopup("丑照达人 +320", "🏆");
    }
    if (before < 8 && state.photoForms.length >= 8) {
      addScore(900);
      showPopup("全形态丑照 +900", "💀");
      debris(14);
    }
  }

  function render() {
    elements.score.textContent = formatScore(state.score);
    elements.time.textContent = `${Math.max(0, state.timeLeft).toFixed(1)}s`;
    state.maxMultiplier = Math.max(state.maxMultiplier, multiplierNow());
    elements.mult.textContent = `×${multiplierNow().toFixed(1)}`;
    elements.multiplier.dataset.hot = String(state.combo >= 5 || state.frenzy);

    const sanity = Math.max(0, Math.round(state.sanity));
    elements.sanity.textContent = String(sanity);
    elements.sanityMeter.setAttribute("aria-valuenow", String(sanity));
    elements.sanityBar.style.width = `${clamp(sanity)}%`;
    elements.stage.classList.toggle("is-frenzy", state.frenzy);
    elements.frenzyBanner.hidden = !state.frenzy;

    if (state.frenzy) {
      elements.stateLabel.textContent = "暴走";
    } else if (!state.running) {
      elements.stateLabel.textContent = state.ended ? "废了" : "装乖";
    } else if (state.sanity > 70) {
      elements.stateLabel.textContent = "记仇";
    } else if (state.sanity > 35) {
      elements.stateLabel.textContent = "破防";
    } else {
      elements.stateLabel.textContent = "想咬人";
    }

    elements.actions.forEach((button) => {
      button.disabled = !state.running || state.ended || Boolean(state.event) || state.photoViewing;
    });
    elements.galleryCount.textContent = `${state.photoForms.length}/8`;
    elements.galleryGrid.querySelectorAll(".frog-photo-thumb").forEach((button, index) => {
      const form = PHOTO_FORMS[index];
      const unlocked = state.photoForms.includes(form.id);
      button.disabled = !unlocked || Boolean(state.event);
      button.classList.toggle("is-unlocked", unlocked);
      button.querySelector(".frog-photo-label").textContent = unlocked ? form.title : "未解锁";
      button.setAttribute("aria-label", unlocked ? `查看丑照：${form.title}` : `未解锁丑照 ${index + 1}`);
    });
    elements.start.hidden = state.running || state.ended;

    if (state.event) {
      const ratio = clamp(state.eventTime / 5.5, 0, 1);
      elements.eventBar.style.width = `${ratio * 100}%`;
      elements.eventMeter.setAttribute("aria-valuenow", String(Math.max(0, state.eventTime).toFixed(1)));
    }
  }

  function startGame() {
    if (state.running) return;
    if (gameLoopId) window.clearInterval(gameLoopId);
    resetState();
    state.running = true;
    lastFrame = performance.now();
    elements.result.hidden = true;
    elements.event.hidden = true;
    elements.photoViewer.hidden = true;
    state.photoViewing = false;
    elements.start.hidden = true;
    removeBonusTarget();
    bubble("开始。");
    elements.announcer.textContent = "开始。";
    setAnimation("idle");
    render();
    playSound("start");
    gameLoopId = window.setInterval(gameLoop, 100);
  }

  function gameLoop() {
    if (!state.running) return;
    const now = performance.now();
    const dt = Math.min(.25, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;

    if (state.photoViewing) return;

    if (state.event) {
      state.eventTime -= dt;
      if (state.eventTime <= 0) missEvent();
      render();
      return;
    }

    state.timeLeft -= dt;
    if (state.frenzy) {
      state.frenzyLeft -= dt;
      if (state.frenzyLeft <= 0) recoverFromFrenzy();
    }

    if (state.timeLeft <= 0) {
      endGame();
      return;
    }

    state.nextBonusAt -= dt;
    if (state.nextBonusAt <= 0) spawnBonusTarget();

    const elapsed = 40 - state.timeLeft;
    if (elapsed >= state.nextEventAt && !state.event) openEvent();
    render();
  }

  function spawnBonusTarget() {
    if (state.event || state.photoViewing || state.ended) return;
    removeBonusTarget();
    const target = document.createElement("button");
    target.type = "button";
    target.className = "frog-bonus cursor-interaction";
    target.setAttribute("aria-label", "抓住破绽");
    target.style.setProperty("--bonus-x", `${14 + Math.random() * 72}%`);
    target.style.setProperty("--bonus-y", `${33 + Math.random() * 35}%`);
    target.addEventListener("click", () => hitBonus(target));
    elements.stage.appendChild(target);
    state.nextBonusAt = 2.8 + Math.random() * 2.2;
    window.setTimeout(() => {
      if (target.isConnected) {
        target.remove();
        state.nextBonusAt = 1.2;
      }
    }, 2100);
  }

  function removeBonusTarget() {
    elements.stage.querySelectorAll(".frog-bonus").forEach((target) => target.remove());
  }

  function hitBonus(target) {
    if (!state.running || state.ended || state.event || state.photoViewing) return;
    target.remove();
    const now = performance.now();
    bumpCombo(now);
    state.bonusHits += 1;
    const points = Math.round(180 * multiplierNow());
    addScore(points);
    state.sanity = clamp(state.sanity - 1.5);
    bubble(choose(["抓到了。", "破绽 +1。", "奶蛙慌了。"]));
    setAnimation("wave", 360);
    showPopup(`+${points}`, "💥");
    debris(5);
    playSound("bonus");
    if (state.sanity <= 0) triggerFrenzy();
    render();
  }

  function pokeFrog() {
    if (state.event || state.photoViewing) return;
    if (!state.running) {
      bubble("先开搞。");
      setAnimation("wave", 650);
      playSound("poke");
      return;
    }
    if (state.ended) return;
    const now = performance.now();
    bumpCombo(now);
    state.taps += 1;
    const points = Math.max(4, Math.round(7 * multiplierNow()));
    addScore(points);
    state.sanity = clamp(state.sanity - .55);
    bubble(choose(TAP_LINES));
    setAnimation(state.frenzy ? "laugh" : "wave", state.frenzy ? 0 : 330);
    showPopup(`+${points}`, "👆");
    if (state.taps % 3 === 0) debris(3);
    playSound("poke");
    if (state.sanity <= 0) triggerFrenzy();
    render();
  }

  function usePrank(key) {
    if (!state.running || state.ended || state.event || state.photoViewing) return;
    const prank = PRANKS[key];
    if (!prank) return;
    const now = performance.now();
    if (now < (state.cooldowns[key] || 0)) {
      bubble("手太快了，奶蛙还没把上一条缺德行为记进账。");
      playSound("oops");
      return;
    }
    state.cooldowns[key] = now + 620;
    state.lastActionAt = now;
    state.pranks += 1;
    bumpCombo(now);
    const points = Math.round(prank.base * multiplierNow());
    addScore(points);
    state.sanity = clamp(state.sanity - prank.sanity);
    const line = choose(prank.lines);
    bubble(line);
    setAnimation(prank.anim, 900);
    showPopup(`+${points}`, prank.icon);
    debris(4 + Math.min(6, Math.floor(state.combo / 3)));
    if (key === "photo") {
      cameraFlash();
      capturePhoto();
    }
    playSound(key);
    if (state.sanity <= 0) triggerFrenzy();
    elements.announcer.textContent = elements.speech.textContent;
    render();
  }

  function triggerFrenzy() {
    if (state.frenzy) return;
    state.frenzy = true;
    state.frenzyLeft = 7;
    state.frenzies += 1;
    state.sanity = 0;
    addScore(280);
    bubble("理智清零。暴走！");
    showPopup("暴走！+280", "🚨");
    setAnimation("laugh");
    debris(12);
    playSound("frenzy");
    elements.announcer.textContent = "奶蛙暴走，得分翻倍。";
    render();
  }

  function recoverFromFrenzy() {
    state.frenzy = false;
    state.frenzyLeft = 0;
    state.sanity = 55;
    bubble("回充。继续。");
    setAnimation("sad", 1000);
    playSound("recover");
    render();
  }

  function openEvent() {
    removeBonusTarget();
    const event = EVENTS[state.eventIndex % EVENTS.length];
    state.eventIndex += 1;
    state.events += 1;
    state.nextEventAt += 13;
    state.event = event;
    state.eventTime = 5.5;
    elements.eventKicker.textContent = event.kicker;
    elements.eventTitle.textContent = event.title;
    elements.eventCopy.textContent = event.copy;
    elements.eventActions.replaceChildren();
    event.choices.forEach((choice, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = index === 1 ? "btn btn-primary" : "btn";
      button.textContent = `${index === 0 ? "A" : "B"} · ${choice.label}`;
      button.addEventListener("click", () => resolveEvent(choice));
      elements.eventActions.appendChild(button);
    });
    elements.event.hidden = false;
    elements.eventBar.style.width = "100%";
    bubble("选一个。");
    setAnimation("think");
    playSound("event");
    render();
    window.setTimeout(() => elements.eventActions.querySelector("button")?.focus(), 40);
    elements.announcer.textContent = event.title;
  }

  function resolveEvent(choice) {
    if (!state.event) return;
    addScore(choice.score);
    state.sanity = clamp(state.sanity + choice.sanity);
    state.event = null;
    state.eventTime = 0;
    elements.event.hidden = true;
    bubble(choice.bubble);
    setAnimation(choice.anim, 1100);
    showPopup(`+${choice.score}`, "🎬");
    debris(8);
    playSound("eventwin");
    if (state.sanity <= 0) triggerFrenzy();
    elements.announcer.textContent = choice.bubble;
    render();
  }

  function missEvent() {
    if (!state.event) return;
    state.event = null;
    elements.event.hidden = true;
    state.score = Math.max(0, state.score - 70);
    state.combo = 0;
    state.sanity = clamp(state.sanity - 8);
    bubble("犹豫太久。");
    setAnimation("sad", 900);
    playSound("oops");
    render();
  }

  function endGame() {
    if (!state.running) return;
    state.running = false;
    state.ended = true;
    state.timeLeft = 0;
    if (gameLoopId) window.clearInterval(gameLoopId);
    gameLoopId = null;
    elements.event.hidden = true;
    state.event = null;
    state.frenzy = false;
    state.photoViewing = false;
    removeBonusTarget();
    elements.photoViewer.hidden = true;
    elements.start.hidden = true;
    state.bestScore = Math.max(state.bestScore, Math.round(state.score));
    saveBestScore(state.bestScore);

    const score = Math.round(state.score);
    let title = "礼貌性社死";
    let copy = "奶蛙不想理你。";
    if (score >= 4600) {
      title = "奶蛙本蛙来投诉了";
      copy = "奶蛙报警了。";
    } else if (score >= 3300) {
      title = "互联网抽象遗产";
      copy = "已封存进祖谱。";
    } else if (score >= 2100) {
      title = "奶蛙认证缺德带师";
      copy = "奶蛙正在起诉。";
    } else if (score >= 900) {
      title = "手欠实习生";
      copy = "奶蛙记住了你。";
    }

    elements.resultTitle.textContent = title;
    elements.resultCopy.textContent = copy;
    elements.resultScore.textContent = String(score);
    elements.resultChips.replaceChildren();
    [
      `最高倍率 ×${state.maxMultiplier.toFixed(1)}`,
      `戳肚皮 ${state.taps}`,
      `缺德操作 ${state.pranks}`,
      `丑照 ${state.photoForms.length}/8`,
      `破绽 ${state.bonusHits}`,
      `暴走 ${state.frenzies}`,
      `事故 ${state.events}`,
      `本机最佳 ${state.bestScore}`
    ].forEach((label) => {
      const chip = document.createElement("span");
      chip.textContent = label;
      elements.resultChips.appendChild(chip);
    });
    elements.result.hidden = false;
    bubble("结束。");
    setAnimation("review");
    playSound("end");
    elements.announcer.textContent = `结束。${title}，${score}分。`;
    render();
    persistGameState("complete");
    window.setTimeout(() => elements.restart.focus(), 50);
  }

  function persistGameState(phase) {
    try {
      window.dispatchEvent(new CustomEvent("naifrog:run-complete", {
        detail: {
          game: "奶蛙，给我笑！",
          phase,
          score: Math.round(state.score),
          bestCombo: state.bestCombo,
          taps: state.taps,
          pranks: state.pranks,
          frenzies: state.frenzies,
          photos: state.photoForms.length
        }
      }));
    } catch {
    }
  }

  function getAudioContext() {
    if (!soundEnabled) return null;
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    if (!audioContext) audioContext = new AudioCtor();
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
    return audioContext;
  }

  function tone(frequency, duration, type = "sine", delay = 0, volume = .028) {
    const ctx = getAudioContext();
    if (!ctx) return;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    const start = ctx.currentTime + delay;
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + .01);
    gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(start);
    oscillator.stop(start + duration + .03);
  }

  function slide(frequency, endFrequency, duration, type = "sine", volume = .025) {
    const ctx = getAudioContext();
    if (!ctx) return;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    const start = ctx.currentTime;
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), start + duration);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(start);
    oscillator.stop(start + duration + .03);
  }

  function playSound(type) {
    if (!soundEnabled) return;
    if (type === "poke") {
      tone(620, .055, "triangle");
      tone(880, .05, "triangle", .035);
    } else if (type === "coffee") {
      slide(240, 760, .18, "square", .018);
    } else if (type === "sock") {
      slide(150, 70, .3, "sawtooth", .018);
    } else if (type === "nailong") {
      tone(660, .08, "triangle");
      tone(520, .1, "triangle", .08);
    } else if (type === "photo") {
      tone(980, .035, "square", 0, .018);
      tone(140, .08, "square", .05, .014);
    } else if (type === "bonus") {
      tone(880, .045, "triangle");
      tone(1175, .06, "triangle", .045);
    } else if (type === "event") {
      [440, 554, 659].forEach((frequency, index) => tone(frequency, .09, "triangle", index * .07));
    } else if (type === "eventwin") {
      [523, 659, 784].forEach((frequency, index) => tone(frequency, .12, "sine", index * .07));
    } else if (type === "frenzy") {
      [261, 392, 523, 784, 1046].forEach((frequency, index) => tone(frequency, .11, "square", index * .06, .018));
    } else if (type === "recover") {
      slide(620, 220, .26, "sine", .022);
    } else if (type === "oops") {
      tone(180, .1, "sawtooth", 0, .018);
      tone(130, .14, "sawtooth", .09, .018);
    } else if (type === "start") {
      tone(294, .08);
      tone(440, .12, "sine", .08);
    } else if (type === "end") {
      tone(330, .12);
      tone(294, .14, "sine", .12);
      tone(220, .2, "sine", .24);
    }
  }

  function resetUI() {
    resetState();
    elements.result.hidden = true;
    elements.event.hidden = true;
    elements.photoViewer.hidden = true;
    elements.start.hidden = false;
    elements.start.textContent = "开搞";
    bubble("来啊。");
    elements.announcer.textContent = "";
    updateSoundButton();
    setAnimation("idle");
    render();
  }

  function updateSoundButton() {
    elements.sound.setAttribute("aria-pressed", String(soundEnabled));
    elements.sound.setAttribute("aria-label", soundEnabled ? "关闭音效" : "打开音效");
    elements.sound.textContent = soundEnabled ? "🔊" : "🔇";
  }

  elements.start.addEventListener("click", startGame);
  elements.restart.addEventListener("click", startGame);
  elements.poke.addEventListener("click", pokeFrog);
  elements.actions.forEach((button) => {
    button.addEventListener("click", () => usePrank(button.dataset.prank));
  });
  elements.photoViewerClose.addEventListener("click", closePhotoViewer);
  elements.sound.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    updateSoundButton();
    if (soundEnabled) playSound("nailong");
  });

  root.addEventListener("keydown", (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (!state.running || state.ended || state.event || state.photoViewing) return;
    const map = { "1": "coffee", "2": "sock", "3": "nailong", "4": "photo" };
    if (map[event.key]) {
      event.preventDefault();
      usePrank(map[event.key]);
    } else if (event.key.toLowerCase() === "q") {
      event.preventDefault();
      pokeFrog();
    }
  });

  spriteLoopId = window.setInterval(drawSpriteFrame, 70);
  const spriteProbe = new Image();
  spriteProbe.addEventListener("load", () => root.classList.add("frog-sprite-ready"), { once: true });
  spriteProbe.src = "./assets/naifrog-spritesheet.webp";
  state.bestScore = loadBestScore();
  buildGallery();
  resetUI();
})();
</script>

  </main>
